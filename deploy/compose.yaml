name: lapidary

services:
  db:
    # Resource ceiling. Lapidary must run on a modest workstation, not only on
    # a machine with spare gigabytes -- Postgres is the floor of the whole stack.
    # Compose v2 honours deploy.resources outside swarm.
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    build:
      context: .
      dockerfile: db/Containerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lapidary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lapidary}
    volumes:
      # Mount the PARENT, not .../data. From PostgreSQL 18 the official image stores data in
      # a major-version-scoped subdirectory (PGDATA defaults to /var/lib/postgresql/18/docker),
      # and mounting at the old /var/lib/postgresql/data makes the entrypoint hard-fail with
      # "in 18+, these Docker images are configured to store database data in a format which
      # is compatible with pg_ctlcluster". Mounting the parent is what upstream recommends,
      # and it is what allows `pg_upgrade --link` across a future major version without mount
      # boundary issues. Note the consequence: moving to a PG19 image is a pg_upgrade job, not
      # a tag change — a bare tag bump would start an empty 19/docker beside the 18 data.
      - lapidary-db:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lapidary} -d ${POSTGRES_DB:-lapidary}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    # Resource ceiling. Lapidary must run on a modest workstation, not only on
    # a machine with spare gigabytes -- the open path reads rows and blobs; it never meshes.
    # Compose v2 honours deploy.resources outside swarm.
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    build:
      context: ..
      dockerfile: deploy/Containerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lapidary}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lapidary}
      LAPIDARY_BIND: 0.0.0.0:8080
      LAPIDARY_LOG: ${LAPIDARY_LOG:-info}
      # Serves the grid and the open path. Never the scan route — this image deliberately
      # does not link the CAD kernel (no SERVER_FEATURES build arg below).
      LAPIDARY_ROLE: api
      # Names the mount below. Required for the api role as of the LOD ladder: this is
      # where GET /api/blob/{blake3} reads a rung from, and a router with that route and
      # no root to read from would answer 500 for every part anyone opened.
      LAPIDARY_BLOB_ROOT: /var/lib/lapidary
      # Names the second mount below, and required for the api role since uploads: a
      # partial upload is assembled here and only enters the blob store once its bytes
      # have been verified against the hash the browser claimed. Deliberately not a
      # subdirectory of LAPIDARY_BLOB_ROOT — everything under that root is
      # content-addressed and complete, and a half-transferred file is neither.
      LAPIDARY_UPLOAD_DIR: /var/lib/lapidary-uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # The same blob store the worker writes, mounted read-write rather than :ro.
      #
      # Slice 1's grid does not actually read this yet — thumbnails are small enough to
      # live inline in Postgres as `derivative.thumbnail_webp` (DATA.md §1.5), so a page
      # of cards costs one query and no per-card round trip. The mount is here because
      # the open path's next step is derivatives too large to inline (glTF for the
      # viewer), and those are read from, and cached into, this store.
      #
      # Read-write is deliberate and is not a hole in "the open path never touches a
      # source file". That boundary is a type, not a mount flag: `SourceStore` — the
      # handle that can read, write and reap any source blob — demands a `WorkerRole`
      # token this crate cannot obtain, and the two narrow handles it can construct do
      # exactly one thing each, in exactly one named route each, enforced by
      # `cargo xtask check-deploy`. A read-only mount would break both the derivative
      # cache writes and the upload commit the api legitimately needs, while adding
      # nothing that boundary does not already give.
      - lapidary-blobs:/var/lib/lapidary:Z
      # Partial uploads, and only the api's: the worker mounts nothing here and serves no
      # upload route. Separate from the blob volume so a half-transferred file is never
      # inside a store whose whole contract is that everything in it is complete, and so
      # an operator reclaiming abandoned transfers is looking at a volume that holds
      # nothing else.
      - lapidary-uploads:/var/lib/lapidary-uploads:Z

  worker:
    # Resource ceiling. Lapidary must run on a modest workstation, not only on
    # a machine with spare gigabytes -- the only service that parses meshes, so it gets the largest share.
    # Compose v2 honours deploy.resources outside swarm.
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    build:
      context: ..
      dockerfile: deploy/Containerfile
      args:
        # Only the worker links the CAD kernel — the open path (api) never invokes it.
        SERVER_FEATURES: mock-kernel
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lapidary}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lapidary}
      LAPIDARY_BIND: 0.0.0.0:8081
      LAPIDARY_LOG: ${LAPIDARY_LOG:-info}
      # Runs ingest. Must never be "api" — see lapidary-api::Role and ApiError::UnknownRole.
      LAPIDARY_ROLE: worker
      # Both are required for LAPIDARY_ROLE=worker and have no default in the binary —
      # bin/lapidary-server refuses to start without them rather than guessing a path.
      # They name the two mounts below.
      LAPIDARY_INGEST_DIR: /ingest
      # The bundled examples, copied into the image by deploy/Containerfile. Seeded once,
      # on the first start of a library nothing has ever run in — see
      # `lapidary_ingest::seed`. Unset it to start with an empty grid.
      LAPIDARY_EXAMPLE_DIR: /usr/share/lapidary/example-parts
      LAPIDARY_BLOB_ROOT: /var/lib/lapidary
      # Job worker knobs, worker-only — the api service has no worker to configure.
      # Passed through empty when unset, which bin/lapidary-server reads as "use the
      # default": the defaults live in lapidary_jobs::WorkerConfig so exactly one place
      # decides them, and restating the numbers here would let the two drift apart.
      #
      # Empty is load-bearing, not sloppiness. `${VAR:-}` yields a variable that is
      # present and empty for every operator who never set one, and an empty string is
      # not a usize — see empty_str_as_none in bin/lapidary-server/src/main.rs, which
      # exists so that case starts the worker instead of refusing to boot.
      #
      # deploy/.env.example documents what each knob does and what it defaults to.
      LAPIDARY_WORKER_CONCURRENCY: ${LAPIDARY_WORKER_CONCURRENCY:-2}
      LAPIDARY_JOB_LEASE_SECS: ${LAPIDARY_JOB_LEASE_SECS:-}
      LAPIDARY_JOB_POLL_SECS: ${LAPIDARY_JOB_POLL_SECS:-}
      LAPIDARY_WORKER_ID: ${LAPIDARY_WORKER_ID:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # The scan route lives here, not on api:8080. Published so the documented
      # `curl -X POST localhost:8081/api/libraries/<id>/scan` works from the host.
      - "8081:8081"
    volumes:
      # The directory of parts to ingest, read-only: ingest hashes and copies bytes into
      # the blob store, and must never be able to modify what it was pointed at. The
      # default is this repository's `example/parts`, so a first run with no .env edits
      # still lands six real parts in the grid; point LAPIDARY_INGEST_DIR at your own
      # folder to scan that instead.
      #
      # `z`, lowercase, not `Z`. This is the one BIND mount in the file — the two named
      # volumes above are ours and carry `:Z` — and on an SELinux-enforcing host
      # (Fedora, RHEL, the platform the README recommends Podman for) a bind mount with
      # no label gets the worker EACCES on every file, so the documented first-run curl
      # answers 500 with a directory the operator can read perfectly well themselves.
      # The difference between the two flags matters here and only here: `Z` relabels
      # the directory with a private, per-container label, and this directory belongs to
      # the *user* — it is their parts folder, possibly their whole CAD library, and
      # possibly shared with other containers. Taking exclusive ownership of it to read
      # it once would be a worse bug than the one being fixed. `z` applies a shared
      # label, which is what a read-only source directory wants.
      - ${LAPIDARY_INGEST_DIR:-../example/parts}:/ingest:ro,z
      - lapidary-blobs:/var/lib/lapidary:Z

  web:
    # Resource ceiling. Lapidary must run on a modest workstation, not only on
    # a machine with spare gigabytes -- a static bundle behind a tiny server.
    # Compose v2 honours deploy.resources outside swarm.
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    build:
      context: ..
      dockerfile: deploy/web/Containerfile
    depends_on:
      - api
    ports:
      - "3000:8080"

volumes:
  lapidary-db:
  # Content-addressed blobs and derivatives, shared by worker (writes source bytes) and
  # api (reads and caches derivatives). Named, not a bind mount: these are our data, not
  # the user's files, and deleting the compose project must not take a host directory
  # with it. deploy/Containerfile creates /var/lib/lapidary owned by the `lapidary` user
  # so a freshly created volume inherits that ownership instead of coming up root-owned
  # and unwritable to a container that does not run as root.
  lapidary-blobs:
  # Chunks in flight. Named for the same reason the blob volume is — our data, not the
  # user's files — and persistent on purpose: the staged file's length is what a resuming
  # upload asks for, so a volume is what makes an api restart cost nothing instead of a
  # re-transfer. Nothing sweeps it yet; slice 7 owns reclaiming disk, and a second reaper
  # written now would be one to keep in step with the real one.
  lapidary-uploads:
