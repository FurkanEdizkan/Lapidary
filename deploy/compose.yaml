name: lapidary

services:
  db:
    # Resource ceiling. Lapidary must run on a modest workstation, not only on
    # a machine with spare gigabytes -- Postgres is the floor of the whole stack.
    # Compose v2 honours deploy.resources outside swarm.
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    # Stock Postgres, pinned. pg_trgm ships in its contrib and migration 0001 creates it.
    image: docker.io/library/postgres:18@sha256:7341002d2b8c7c5bdd7542a671a95b36196c0b5b888daf454ae4fc33ba5346d7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lapidary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lapidary}
    volumes:
      # Mount the PARENT, not .../data. From PostgreSQL 18 the official image stores data in
      # a major-version-scoped subdirectory (PGDATA defaults to /var/lib/postgresql/18/docker),
      # and mounting at the old /var/lib/postgresql/data makes the entrypoint hard-fail with
      # "in 18+, these Docker images are configured to store database data in a format which
      # is compatible with pg_ctlcluster". Mounting the parent is what upstream recommends,
      # and it is what allows `pg_upgrade --link` across a future major version without mount
      # boundary issues. Note the consequence: moving to a PG19 image is a pg_upgrade job, not
      # a tag change — a bare tag bump would start an empty 19/docker beside the 18 data.
      - lapidary-db:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lapidary} -d ${POSTGRES_DB:-lapidary}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # The API, the job worker and the browser app, in one process (S1, 2026-10-16). Until then
    # they were three containers, `api`, `worker` and a Caddy `web`, split so the api image never
    # linked the OCCT kernel; the kernel is gone and ingest takes about 200 ms a file.
    # Resource ceiling: Lapidary must run on a modest workstation, not only on a machine with
    # spare gigabytes. The mesh parsers are the largest user. 3g since F3 (2026-10-16): with the
    # 3MF cap at 20 M triangles, two of the owner's 11 M-triangle Bambu kits parsing at once
    # touched 2 GiB; see docs/goals/F3.md for what 3g measured.
    # Compose v2 honours deploy.resources outside swarm.
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"
    build:
      context: ..
      dockerfile: deploy/Containerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lapidary}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lapidary}
      LAPIDARY_BIND: 0.0.0.0:8080
      LAPIDARY_LOG: ${LAPIDARY_LOG:-info}
      # The browser app, built into the image by deploy/Containerfile's `web` stage.
      LAPIDARY_WEB_DIR: /usr/share/lapidary/web
      # The store every model is kept in: the bind mount below.
      LAPIDARY_BLOB_ROOT: /var/lib/lapidary
      # A partial upload is assembled here and only enters the store once its bytes have been
      # verified against the hash the browser claimed. Deliberately not a subdirectory of
      # LAPIDARY_BLOB_ROOT — everything under that root is complete, and a half-sent file is not.
      LAPIDARY_UPLOAD_DIR: /var/lib/lapidary-uploads
      # Your models folder (A2): the one storage location. Lapidary reads each model where it is,
      # writes uploads under `uploads/<you>/` and imports under `imports/` once, and moves a
      # removed model's file into `_removed/` — it never deletes a file there.
      LAPIDARY_INGEST_DIR: /models
      LAPIDARY_INBOX_DIR: /models
      # The bundled examples, copied into the image by deploy/Containerfile. Seeded once, on
      # the first start of a library nothing has ever run in — see `lapidary_ingest::seed`.
      # Unset it to start with an empty grid.
      LAPIDARY_EXAMPLE_DIR: /usr/share/lapidary/example-parts
      # The same value as the storage mount below, told to the process rather than only to the
      # runtime. Nothing reads a file through it: it is what the card shows when it says where a
      # model is, which is only useful if it is somewhere a person can open. Ignored unless
      # absolute, so the `../storage` fallback is harmless; set LAPIDARY_STORAGE_ROOT to an
      # absolute path, as .env.example recommends, and the paths appear.
      LAPIDARY_HOST_STORAGE_ROOT: ${LAPIDARY_STORAGE_ROOT:-../storage}
      # The same, for your models folder: what a card's "show in folder" path starts with.
      LAPIDARY_HOST_INGEST_ROOT: ${LAPIDARY_MODELS_DIR:-../models}
      LAPIDARY_HOST_INBOX_ROOT: ${LAPIDARY_MODELS_DIR:-../models}
      # Importing a model from its Printables, Thingiverse or MyMiniFactory page (F3). `false` turns
      # it off — the Settings page says so and nothing contacts those sites — for an install that
      # must make no outbound request beyond a picture somebody pastes.
      LAPIDARY_IMPORT_LINKS: ${LAPIDARY_IMPORT_LINKS:-true}
      # The first-run wizard's setup code (A1). Unset, the server makes one and prints it in its log
      # (`docker compose logs app`); set it for a scripted install.
      LAPIDARY_SETUP_CODE: ${LAPIDARY_SETUP_CODE:-}
      # `true` behind https, so the session cookie is sent over https only.
      LAPIDARY_COOKIE_SECURE: ${LAPIDARY_COOKIE_SECURE:-false}
      # Job worker knobs, passed through empty when unset, which the server reads as "use the
      # default" (`empty_str_as_none` in bin/lapidary-server/src/main.rs). The defaults live in
      # lapidary_jobs::WorkerConfig; deploy/.env.example documents each one.
      LAPIDARY_WORKER_CONCURRENCY: ${LAPIDARY_WORKER_CONCURRENCY:-2}
      LAPIDARY_JOB_LEASE_SECS: ${LAPIDARY_JOB_LEASE_SECS:-}
      LAPIDARY_JOB_POLL_SECS: ${LAPIDARY_JOB_POLL_SECS:-}
      LAPIDARY_WORKER_ID: ${LAPIDARY_WORKER_ID:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # The app and its API on one port. 3000 on the host, as the web container had.
      - "${LAPIDARY_PORT:-3000}:8080"
    volumes:
      # The user's own storage root — a bind-mounted host directory, not a named volume. The
      # whole point of this layout (docs/DATA.md §1.1) is that a user can open it in a file
      # manager and find a model by name.
      #
      # `z`, lowercase, not `Z`, on both bind mounts. On an SELinux-enforcing host (Fedora, RHEL)
      # a bind mount with no label gets EACCES on every file. `Z` would relabel the directory
      # with a private, per-container label, and these directories belong to the *user* —
      # possibly shared with other programs. `z` applies a shared label.
      #
      # UPGRADING: a deployment that ran before this layout kept its store in the
      # `lapidary-blobs` named volume this file no longer declares. docs/DATA.md §1.1,
      # "Upgrading a store created before this layout", has the command.
      - ${LAPIDARY_STORAGE_ROOT:-../storage}:/var/lib/lapidary:z
      # Your models folder, read-write (A2): the one storage location. Lapidary writes new files
      # (uploads, imports, the seeded examples) and moves a removed model's file into `_removed/`;
      # it never deletes one (`cargo xtask check-deploy` keeps the code that could out of the API).
      # It runs as uid 10001, so that user needs write access to the folder — see .env.example.
      - ${LAPIDARY_MODELS_DIR:-../models}:/models:z
      # Partial uploads. A named volume and not part of the storage root, so a half-transferred
      # file is never inside a directory whose contract is that everything in it is complete.
      - lapidary-uploads:/var/lib/lapidary-uploads:Z

volumes:
  # Postgres data only. Named, not a bind mount: opaque relational storage nobody needs
  # to open in a file manager, and deleting the compose project must not take it with it
  # either. The storage root (app's `/var/lib/lapidary` mount, above) is a
  # bind mount instead, precisely so a user CAN find it on disk — see the comment on
  # app's volumes for why. A bind-mounted host directory comes up owned by whatever
  # created it, not by deploy/Containerfile's `lapidary` user, so an operator pointing
  # `LAPIDARY_STORAGE_ROOT` at a fresh directory must make sure it is writable by the
  # container.
  lapidary-db:
  # Chunks in flight. A named volume and not part of the storage root — the store is the
  # user's files and a half-sent chunk is not one — and persistent on purpose: the staged
  # file's length is what a resuming upload asks for, so a volume is what makes a
  # restart cost nothing instead of a re-transfer. Nothing sweeps it yet; the derivative
  # reaper owns reclaiming disk, and a second reaper written now would be one to keep in
  # step with the real one.
  lapidary-uploads:
