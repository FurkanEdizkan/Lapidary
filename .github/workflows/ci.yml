name: CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:7341002d2b8c7c5bdd7542a671a95b36196c0b5b888daf454ae4fc33ba5346d7
        env:
          POSTGRES_PASSWORD: lapidary
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:lapidary@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo xtask check-layers
      - run: cargo xtask check-deploy
      # Mangled line-continuations inside string literals are invisible to fmt, clippy
      # and every test — fmt does not inspect literal CONTENTS — and they reach operators
      # as runtime error messages. That class has recurred twice here; this gate exists
      # to close it, and a gate that runs nowhere closes nothing.
      - run: cargo xtask check-strings
      - run: cargo test --workspace --all-features

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo xtask export-bindings
      - name: Bindings must be committed and current
        run: |
          # git status, not git diff. The export deletes and recreates the directory, so a
          # type newly given #[ts(export)] produces an UNTRACKED file — and `git diff` never
          # reports untracked files, so the stalest possible case would pass silently.
          if git status --porcelain -- web/src/bindings | grep -q .; then
            echo "::error::web/src/bindings is stale. Run 'cargo xtask export-bindings' and commit the result."
            git status --porcelain -- web/src/bindings
            exit 1
          fi
      - run: cargo xtask export-agents-md
      - name: AGENTS.md must be committed and current
        run: |
          # AGENTS.md is CLAUDE.md's content under the filename every other agent reads.
          # Generated rather than symlinked so a Windows checkout without symlink support
          # gets the rules instead of a 9-byte text file; gated here for the same reason
          # the bindings are, because a generated file nobody checks goes stale silently.
          if git status --porcelain -- AGENTS.md | grep -q .; then
            echo "::error::AGENTS.md is stale. Run 'cargo xtask export-agents-md' and commit the result."
            git status --porcelain -- AGENTS.md
            exit 1
          fi

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The range below needs both endpoints and everything between them.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Commit messages in this change must follow the convention
        run: |
          # The local commit-msg hook is bypassable with --no-verify and absent on a
          # machine where `cargo xtask setup` was never run; this is the backstop.
          #
          # It checks only the commits this push or PR ADDS. 148 of this repository's
          # commits predate the AI-attribution rule and carry the trailers it rejects, so
          # a job that walked history would fail permanently and teach everyone to ignore
          # it. Where the range cannot be determined, the job skips and says so rather
          # than guessing — the same rule the other gates follow.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::branch creation, no previous tip to diff against — skipping"
            exit 0
          elif ! git merge-base --is-ancestor "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null; then
            echo "::notice::history was rewritten, so the pushed range is not resolvable — skipping"
            exit 0
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi

          commits=$(git rev-list --no-merges "$range")
          count=$(echo "$commits" | grep -c . || true)

          # A push that lands a merge sets `before` to the previous tip, so the range
          # swallows the whole merged branch — merging rust-rewrite would have fed this
          # 146 commits, every one carrying a trailer. Those are not new work being
          # reviewed, and failing on them says nothing useful.
          if [ "$count" -gt 20 ]; then
            echo "::notice::$count commits in range, which is a merge or a batch import rather than new work — skipping"
            exit 0
          fi

          failed=0
          for sha in $commits; do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            if ! cargo xtask check-commit-msg /tmp/commit-msg; then
              echo "::error::$sha ($(git log -1 --format=%s "$sha"))"
              failed=1
            fi
          done
          exit $failed

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The committed route tree must match what the plugin generates
        run: |
          if ! git diff --quiet --exit-code src/routeTree.gen.ts; then
            echo "::error::web/src/routeTree.gen.ts is stale. Run 'npm run build' in web/ and commit the result."
            git diff --stat src/routeTree.gen.ts
            exit 1
          fi
