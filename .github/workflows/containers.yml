name: Containers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The one image deploy/compose.yaml builds: the server, its parsers and the browser app.
      - run: df -h /
      - run: docker build -f deploy/Containerfile -t lapidary:${{ github.sha }} .
      - run: df -h /
