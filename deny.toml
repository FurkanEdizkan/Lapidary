[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# AGPL-3.0-only, not the bare AGPL-3.0: the bare id is deprecated in SPDX and does not
# match what [workspace.package] declares, so cargo-deny would reject all fourteen of our
# own crates while passing every third-party one.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "AGPL-3.0-only"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Every internal lapidary-* path dependency is unversioned (see root Cargo.toml's
# [workspace.dependencies]), which cargo records as `*` and wildcards = "deny" would
# otherwise reject. That's sound here only because every internal crate carries
# publish = false: a wildcard path dependency is only broken for crates.io consumers,
# and these crates can never reach crates.io. These two settings are a pair — do not
# flip this to true without publish = false on every workspace member, and do not add
# publish = true anywhere without reverting this back to false.
allow-wildcard-paths = true

# No SQL outside lapidary-db. Enforced here rather than by review.
[[bans.deny]]
name = "sqlx"
# lapidary-api and lapidary-ingest appear only because #[sqlx::test] is a
# dev-dependency for their own integration tests; neither must ever gain a normal sqlx
# dependency. All real SQL stays in lapidary-db. If this list grows any further, SQL has
# leaked.
wrappers = ["lapidary-db", "lapidary-api", "lapidary-ingest"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
