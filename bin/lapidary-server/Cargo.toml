[package]
name = "lapidary-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Compiles in the mock CAD kernel and reports it at startup. `deploy/Containerfile` builds
# with this feature on, and deploy/compose.yaml's `api` and `worker` services both build
# from that one Containerfile — so both compose services get it, not just `worker`. The
# real OCCT kernel is Phase 0b.
mock-kernel = ["dep:lapidary-cad", "lapidary-cad/mock-kernel"]

[dependencies]
lapidary-api.workspace = true
lapidary-db.workspace = true
# Optional, off by default: only the mock-kernel feature pulls this in. lapidary-api
# never depends on lapidary-cad — the open path lives there and must never invoke the
# kernel — so the worker reaches it directly, through this binary.
lapidary-cad = { workspace = true, optional = true }
anyhow.workspace = true
# This binary owns the listener, so it calls axum::serve directly. lapidary-api builds
# the Router and does not re-export axum. Both resolve to the one version pinned in
# [workspace.dependencies], so there is no skew between the Router's axum and this one.
axum.workspace = true
figment.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
