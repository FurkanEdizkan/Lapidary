[package]
name = "lapidary-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lapidary-api.workspace = true
lapidary-db.workspace = true
# The mesh parsers, the ingest job handler and the job loop that feeds it. The server runs all
# three in-process; `lapidary-api` itself still never links `lapidary-cad` (check-layers).
lapidary-cad.workspace = true
lapidary-ingest.workspace = true
# `Sites::public()`, for the `WorkerHandler` the server builds.
lapidary-sites.workspace = true
lapidary-jobs.workspace = true
anyhow.workspace = true
# This binary owns the listener, so it calls axum::serve directly. lapidary-api builds
# the Router and does not re-export axum. Both resolve to the one version pinned in
# [workspace.dependencies], so there is no skew between the Router's axum and this one.
axum.workspace = true
figment.workspace = true
serde.workspace = true
# The port setting and the port routes' refusals (A5).
serde_json.workspace = true
# `time` for the five-minute flush of which blobs were read (DATA.md §1.4).
tokio = { workspace = true, features = ["time", "sync", "net"] }
# CancellationToken: one shutdown path for the listener, the job loop and the sweep.
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `ServeDir` for the browser app (src/web.rs) and the header layer for its cache rules.
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "set-header"] }

[dev-dependencies]
# Only for #[sqlx::test] against the app's router — see deny.toml's sqlx wrapper allow-list, which
# lists this crate for exactly this reason. No real SQL lives here; lapidary-db still owns all of it.
sqlx.workspace = true
# `MESH_EXTENSIONS`, for the startup line's test.
lapidary-core.workspace = true
# The browser app's files, in src/web.rs's tests.
tempfile.workspace = true
# Only for building the raw fixture rows `enqueue_pending_migrations`'s own tests seed
# directly (a part/revision/file with no storage_path) -- the same reason lapidary-ingest
# and lapidary-api's own test suites already depend on it.
uuid.workspace = true

[lints]
workspace = true
