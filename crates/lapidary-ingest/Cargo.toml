[package]
name = "lapidary-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# An uploaded archive, opened (A10): `archive.rs`. tests/handler.rs also builds a hostile zip with it.
sevenz-rust2.workspace = true
zip.workspace = true
lapidary-core.workspace = true
lapidary-db.workspace = true
lapidary-storage.workspace = true
# The whole reason this is a separate crate from lapidary-api: the open path must never
# depend on lapidary-cad, and the handler below genuinely needs its parsers.
lapidary-cad.workspace = true
# The seam handler.rs implements: JobHandler and HandlerError. L3 -> L2, allowed.
lapidary-jobs.workspace = true
# Reading a bundle back for import (Phase 4 slice 2). L3 -> L2, allowed.
lapidary-targets.workspace = true
# Reading a model from Printables, Thingiverse or MyMiniFactory, through the client that refuses
# private addresses (F3).
lapidary-sites.workspace = true
axum.workspace = true
# Hash first, always: handler.rs computes BLAKE3 over each file's bytes before doing
# anything else with them.
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
# handler.rs's classify_write matches sqlx::Error::Database to read the constraint name
# off a unique violation -- see its doc.
sqlx.workspace = true
# The one place this pipeline knowingly leaves bytes behind (a reap that itself fails)
# logs it — see the record() error arm in handler.rs.
tracing.workspace = true
# reap.rs is a timer rather than a job: it sleeps, it selects on a cancellation token, and
# it needs no queue row to do either.
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
# `Sites::local` and `Net::allowing_loopback`, so a test can serve a site from 127.0.0.1.
lapidary-sites = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
uuid.workspace = true
# `archive.rs`'s tests pack a 7z to open.
sevenz-rust2 = { workspace = true, features = ["compress", "util"] }

[lints]
workspace = true
