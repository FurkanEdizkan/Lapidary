[package]
name = "lapidary-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lapidary-core.workspace = true
lapidary-db.workspace = true
lapidary-storage.workspace = true
# The whole reason this is a separate crate from lapidary-api: the open path must never
# depend on lapidary-cad, and the scan handler below genuinely needs MeshKernel.
lapidary-cad.workspace = true
axum.workspace = true
# Hash first, always: scan.rs computes BLAKE3 over each file's bytes before doing
# anything else with them.
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
# The one place this pipeline knowingly leaves bytes behind (a reap that itself fails)
# logs it — see the record() error arm in scan.rs.
tracing.workspace = true

[dev-dependencies]
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
