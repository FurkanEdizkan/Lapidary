[package]
name = "lapidary-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lapidary-core.workspace = true
lapidary-db.workspace = true
lapidary-storage.workspace = true
# Task 9's scan handler needs MeshKernel; see the Role doc comment in src/lib.rs and
# FORBIDDEN_PAIRS in xtask/src/layers.rs for why this edge is no longer forbidden.
lapidary-cad.workspace = true
lapidary-jobs.workspace = true
lapidary-index.workspace = true
lapidary-vcs.workspace = true
lapidary-build.workspace = true
lapidary-targets.workspace = true
axum.workspace = true
# Hash first, always: scan.rs computes BLAKE3 over each file's bytes before doing
# anything else with them.
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

