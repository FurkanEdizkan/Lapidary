# The download route's body: `spawn_blocking` for the blocking zstd decoder and an mpsc
# channel to bound what it reads ahead. `time` is the batch-status stream's tick. `rt`
# only -- this crate builds a Router and never starts a runtime; `bin/lapidary-server`
# owns that.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
ts-rs.workspace = true

[dev-dependencies]
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

