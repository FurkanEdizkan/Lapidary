[package]
name = "lapidary-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lapidary-core.workspace = true
lapidary-db.workspace = true
lapidary-storage.workspace = true
lapidary-jobs.workspace = true
lapidary-targets.workspace = true
# Reading a model from Printables, Thingiverse or MyMiniFactory, through the client that refuses
# private addresses (F3).
lapidary-sites.workspace = true
argon2.workspace = true
rand_core.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
image.workspace = true
reqwest.workspace = true
url.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The download route's body: `spawn_blocking` for the blocking zstd decoder and an mpsc
# channel to bound what it reads ahead. `time` is the batch-status stream's tick. `rt`
# only -- this crate builds a Router and never starts a runtime; `bin/lapidary-server`
# owns that.
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
# `sync` is `BroadcastStream`: the app-wide event stream's fan-out from one listener to every tab.
tokio-stream = { workspace = true, features = ["sync"] }
# `CancellationToken`, and only that: what ends the event hub, the same signal the worker loop
# already takes. Already linked into this crate's binaries through lapidary-jobs.
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
ts-rs.workspace = true

[dev-dependencies]
# `Sites::local` and `Net::allowing_loopback`, so a test can serve a site from 127.0.0.1.
lapidary-sites = { workspace = true, features = ["testing"] }
# Reads the bundle route's archive back in its tests.
zip.workspace = true
# Writes the zstd frames a part indexed before M4 may still be stored as (`tests/download.rs`).
zstd.workspace = true
sqlx.workspace = true
tempfile.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
