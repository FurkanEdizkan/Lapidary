[package]
name = "lapidary-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lapidary-core.workspace = true
async-trait.workspace = true
jiff.workspace = true
log.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# tokio::join! is how the race test proves two dequeues actually overlap rather than
# running sequentially; tokio::time::timeout is how the deterministic locked-row test
# turns "blocked forever" into a bounded, observable outcome instead of a hung test.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
