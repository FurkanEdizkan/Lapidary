[package]
name = "lapidary-cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
mock-kernel = []

[dependencies]
lapidary-core.workspace = true
async-trait.workspace = true
image.workspace = true
serde.workspace = true
# glb.rs builds the glTF document. Already a workspace dependency used by four other
# crates, so nothing new enters Cargo.lock or the licence audit. Hand-formatting was
# considered and rejected: the accessor min/max are f32 values, and float-to-JSON
# formatting is what a format! string gets wrong once, silently.
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
