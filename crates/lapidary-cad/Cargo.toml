[package]
name = "lapidary-cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
mock-kernel = []
# OcctKernel: drives the occt-bridge sidecar as a subprocess. Off by default, so a build that
# does not run the CAD kernel links neither the process machinery nor the scratch directories.
occt-kernel = ["dep:tempfile", "dep:tokio"]

[dependencies]
lapidary-core.workspace = true
async-trait.workspace = true
image.workspace = true
serde.workspace = true
# glb.rs builds the glTF document. Already a workspace dependency used by four other
# crates, so nothing new enters Cargo.lock or the licence audit. Hand-formatting was
# considered and rejected: the accessor min/max are f32 values, and float-to-JSON
# formatting is what a format! string gets wrong once, silently.
serde_json.workspace = true
# glb.rs compresses both buffers of every rung.
meshopt.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
zip.workspace = true
# Both already workspace dependencies, so nothing new enters Cargo.lock or the licence audit.
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "process", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
