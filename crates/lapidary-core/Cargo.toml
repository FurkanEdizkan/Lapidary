[package]
name = "lapidary-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
# `JobPayload::to_json`/`from_row` own the `job.payload` column's shape, so this crate
# now produces JSON itself rather than only being tested against it.
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
uuid.workspace = true
jiff.workspace = true
# A device id is the BLAKE3 of an installation's public key (`device.rs`), and the rule for
# deriving one belongs beside the type rather than in the crate that opens the connection.
# Already in the tree through lapidary-storage and lapidary-ingest, so nothing new is built.
blake3.workspace = true

[lints]
workspace = true
