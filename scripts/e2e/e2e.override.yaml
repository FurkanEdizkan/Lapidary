# The end-to-end rig's host port, one lane's block at a time.
#
# Deliberately thin. `cargo xtask check-deploy` reads `deploy/compose.yaml` and `deploy/Containerfile` —
# it cannot see this file. So anything here that changed a build stage or what a service is would be a
# deployment change the gate could not check, and a rig that could pass while the real stack was wrong is
# worse than no rig. This file therefore only moves the published port off the literal in `deploy/`, so
# several lanes (and the owner's own install on 3000) can exist at once.
#
# `!override` and not the default list merge: compose *appends* published ports, so without it the app
# would publish both `deploy/`'s literal and the lane's, and the first lane up would take 3000 from the
# owner.
#
# The value is required, with no fallback: `scripts/e2e/stack.sh` writes it into the per-run env file
# from the lane's `.lane.env`, and a missing one must stop compose rather than quietly bind a port nobody
# chose.
services:
  app:
    # Host networking since A5, so the app binds the lane's port itself and the port is fixed here, as
    # an operator would fix it in deploy/.env.
    environment:
      LAPIDARY_PORT: "${LAPIDARY_PORT_WEB:?stack.sh writes this into target/e2e/<lane>/e2e.env}"
